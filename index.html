<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Room Promo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="state-1">

        <div id="view-main" class="view active">
            <div class="macbook-hitbox"></div>

            <div class="windows-screen">
                <span class="blinking-text">нажмите, чтобы запустить windows</span>
            </div>
        </div>

        <div id="view-macbook" class="view">
            <div class="macbook-safezone"></div>
        </div>

        <div id="view-windows" class="view">
            <span class="blinking-text">нажмите, чтобы запустить windows</span>
        </div>

    </div>

    <div id="blink-overlay"></div>

    <script src="script.js"></script>
    <div id="mobile-stub">
        <div class="stub-content">
            <h1>Доступно только на ПК</h1>
            <p>Пожалуйста, откройте данный сайт на компьютере 🖥️</p>
        </div>
</div>
</body>
</html>
